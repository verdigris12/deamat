[build-system]
requires = [
    "setuptools>=68",
    "wheel>=0.37"
]
build-backend = "setuptools.build_meta"

[project]
name = "deamat"
version = "0.3.0"
description = "Interactive scientific viewers built with ImGui, Matplotlib, and pygfx"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "verdigris", email = "verdigris1903@proton.me" }
]
dependencies = [
    "glfw>=2.9,<3",
    "imgui-bundle==1.93.0",
    "matplotlib>=3.10,<3.11",
    "numpy>=2,<3",
    "PyOpenGL>=3.1.9,<4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Graphics"
]

[project.optional-dependencies]
pygfx = [
    "pygfx>=0.15.3,<0.16",
    "rendercanvas>=2.5.2,<2.6",
    "wgpu>=0.29,<0.30",
]

[project.urls]
"Homepage" = "https://github.com/verdigris12/deamat"
"Source" = "https://github.com/verdigris12/deamat"
"Bug Tracker" = "https://github.com/verdigris12/deamat/issues"

[project.scripts]
deamat-demo = "deamat.__main__:main"
mplview = "deamat.mpl_view:main"

[tool.setuptools.packages.find]
include = ["deamat*"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.12",
]
